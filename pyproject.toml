[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jagadish-agent-feedback-loop"
version = "0.1.0"
description = "Product-Data-Model flywheel: mine production feedback into golden evals, gate changes on regressions"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["feedback"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
